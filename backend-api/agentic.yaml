version: 1

project:
  name: replace-me
  type: [web-app]
  maturity: prototype

stack:
  frontend: null
  backend: null
  database: null
  deployment: null

packs:
  - web-app

sources:
  product: PRODUCT.md
  architecture: ARCHITECTURE.md
  design: DESIGN.md
  security: SECURITY.md
  decisions: docs/decisions/
  plans: docs/plans/

agent:
  autonomy: balanced
  inspect_before_asking: true
  require_plan_for:
    - architecture-changes
    - database-migrations
    - public-api-changes
    - authentication-changes
  approval_required_for:
    - add-dependency
    - database-schema-change
    - infrastructure-change
    - production-config-change
  forbidden:
    - expose-secrets
    - destructive-production-actions
    - bypass-security-controls

quality:
  testing: auto-detect
  accessibility: required-for-user-facing-ui
  documentation_consistency: required
  evals: recommended
