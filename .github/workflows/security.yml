name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile security tooling
        run: cargo check --all-targets
      - name: Verify secret scanner behavior
        run: cargo test secret_fixture
      - name: Repository validation
        run: cargo run --quiet -- validate .
