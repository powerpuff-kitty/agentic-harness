name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: High-signal secret scan
        run: python3 scripts/security_scan.py .
      - name: Repository validation
        run: python3 scripts/validate_repo.py .
