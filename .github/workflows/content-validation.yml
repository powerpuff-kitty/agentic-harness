name: Catalog validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate self-hosting contract and catalog
        run: python3 .github/scripts/validate_catalog.py
      - name: Validate architecture registry
        run: python3 .github/scripts/validate_architecture_registry.py
      - name: Validate quality registry
        run: python3 .github/scripts/validate_quality_registry.py
      - name: Validate CLI evidence contracts
        run: |
          python3 -m pip install jsonschema==4.26.0
          python3 .github/scripts/validate_cli_contracts.py

  reading-list:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .agentic/evals/fixtures/adoption/reading-list
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: .agentic/evals/fixtures/adoption/reading-list/package-lock.json
      - run: npm ci --workspaces=false --no-fund --no-audit
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
