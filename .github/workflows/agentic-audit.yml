name: Agentic harness audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile audit tooling
        run: python3 -m py_compile scripts/agentic_audit.py scripts/codebase_audit.py
      - name: Run audit-tool tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit bundled base template
        run: python3 scripts/agentic_audit.py templates/base
