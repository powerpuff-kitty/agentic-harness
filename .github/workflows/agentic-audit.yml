name: Agentic harness audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile
        run: cargo check --all-targets
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Validate manifests and modules
        run: cargo run --quiet -- validate .
      - name: Audit bundled base template
        run: cargo run --quiet -- harness-audit templates/base
      - name: Baseline audit source repository
        run: cargo run --quiet -- audit . > /tmp/audit.json || test $? -eq 1
