name: Agentic harness audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile tooling
        run: python3 -m py_compile scripts/*.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate manifests and modules
        run: python3 scripts/validate_repo.py .
      - name: Audit bundled base template
        run: python3 scripts/agentic_audit.py templates/base
      - name: Baseline audit source repository
        run: python3 scripts/codebase_audit.py . > /tmp/audit.json
